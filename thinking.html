<!DOCTYPE html>
<html lang="en" data-alt-href="/fr/thinking.html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking — Joseph Omidiora</title>
  <meta name="description" content="Essays on infrastructure, Africa, and building — by Joseph Omidiora.">

  <!-- Open Graph -->
  <meta property="og:title" content="Thinking — Joseph Omidiora">
  <meta property="og:description" content="Infrastructure. Africa. Building. All essays by Joseph Omidiora.">
  <meta property="og:image" content="https://josephomidiora.com/images/og/thinking.png">
  <meta property="og:url" content="https://josephomidiora.com/thinking.html">
  <meta property="og:type" content="website">

  <!-- Canonical + hreflang -->
  <link rel="canonical" href="https://josephomidiora.com/thinking.html">
  <link rel="alternate" hreflang="en" href="https://josephomidiora.com/thinking.html">
  <link rel="alternate" hreflang="fr" href="https://josephomidiora.com/fr/thinking.html">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page--thinking">
  <a href="#main" class="skip-link">Skip to content</a>

  <site-nav current-page="/thinking.html" lang="en" en-path="/thinking.html" fr-path="/fr/thinking.html"></site-nav>

  <main id="main" class="container section">

    <header style="margin-bottom:var(--space-8)">
      <h1>Thinking</h1>
      <p class="text-muted" style="font-size:var(--text-h3)">Infrastructure. Africa. Building.</p>
    </header>

    <!-- Pillar filter -->
    <nav class="pillar-filter" aria-label="Filter essays by pillar">
      <button class="pillar-filter__btn" data-pillar-filter="all" aria-pressed="true">All</button>
      <button class="pillar-filter__btn" data-pillar-filter="Infrastructure Intelligence" aria-pressed="false">Infrastructure Intelligence</button>
      <button class="pillar-filter__btn" data-pillar-filter="Founder Dispatches" aria-pressed="false">Founder Dispatches</button>
      <button class="pillar-filter__btn" data-pillar-filter="The Backbone Thesis" aria-pressed="false">The Backbone Thesis</button>
      <button class="pillar-filter__btn" data-pillar-filter="Global Builder Lens" aria-pressed="false">Global Builder Lens</button>
      <button class="pillar-filter__btn" data-pillar-filter="Technical Craft" aria-pressed="false">Technical Craft</button>
    </nav>

    <!-- Essay grid -->
    <div class="essay-grid" id="essay-grid" role="list" aria-live="polite" aria-label="Essays">
      <!-- Populated from essays-manifest.json -->
    </div>

    <!-- Empty state -->
    <p class="empty-state" id="empty-state" role="status">No essays in this pillar yet.</p>

  </main>

  <footer>
    <div class="container">
      <p>© 2026 Joseph Omidiora. Built without a framework.</p>
    </div>
  </footer>

  <script type="module">
    import { SiteNav } from './components/site-nav.js';
    import { EssayCard } from './components/essay-card.js';
    if (!customElements.get('site-nav')) customElements.define('site-nav', SiteNav);
    if (!customElements.get('essay-card')) customElements.define('essay-card', EssayCard);
  </script>

  <!-- Essay loading + pillar filter -->
  <script type="module" defer>
    const grid = document.getElementById('essay-grid');
    const emptyState = document.getElementById('empty-state');
    const filterBtns = document.querySelectorAll('[data-pillar-filter]');
    let allEssays = [];

    function renderEssays(pillar) {
      const filtered = pillar === 'all'
        ? allEssays
        : allEssays.filter((e) => e.pillar === pillar);

      grid.innerHTML = filtered.map((e) => `
        <essay-card
          role="listitem"
          data-pillar-card="${e.pillar}"
          title="${e.title.replace(/"/g, '&quot;')}"
          slug="${e.slug}"
          date="${e.date}"
          pillar="${e.pillar}"
          description="${(e.description ?? '').replace(/"/g, '&quot;')}"
        ></essay-card>
      `).join('');

      const isEmpty = filtered.length === 0;
      emptyState.classList.toggle('visible', isEmpty);
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterBtns.forEach((b) => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        renderEssays(btn.dataset.pillarFilter);
      });
    });

    async function loadEssays() {
      try {
        const res = await fetch('/content/essays-manifest.json');
        if (!res.ok) { return; }
        allEssays = await res.json();
        renderEssays('all');
      } catch {
        emptyState.textContent = 'Essays coming soon.';
        emptyState.classList.add('visible');
      }
    }

    loadEssays();
  </script>

  <script type="module" src="js/lang.js"></script>
</body>
</html>
